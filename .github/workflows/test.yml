name: 🧪 Pro_Connect — Full Test Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  # ─────────────────────────────────────────────────────────────
  # JOB 1: Backend Unit Tests
  # ─────────────────────────────────────────────────────────────
  backend-unit-tests:
    name: 🔧 Backend Unit Tests (Jest)
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install backend dependencies
        run: npm ci

      - name: 🧪 Run unit tests with coverage
        run: npm run test:cov
        working-directory: backend

      - name: 📊 Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────────────────────
  # JOB 2: Backend E2E Tests
  # ─────────────────────────────────────────────────────────────
  backend-e2e-tests:
    name: 🔗 Backend E2E Tests (Supertest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: proconnect_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install backend dependencies
        run: npm ci

      - name: 🗄️ Run Prisma migrations
        run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proconnect_test

      - name: 🔗 Run E2E tests
        run: npm run test:e2e
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/proconnect_test
          JWT_SECRET: test-jwt-secret-for-ci
          NODE_ENV: test

  # ─────────────────────────────────────────────────────────────
  # JOB 3: Frontend E2E Tests (Playwright)
  # ─────────────────────────────────────────────────────────────
  frontend-e2e-tests:
    name: 🎭 Frontend E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: backend-unit-tests

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: 📦 Install frontend dependencies
        run: npm ci

      - name: 🎭 Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: 🏗️ Build Next.js app
        run: npm run build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: 🧪 Run Playwright tests
        run: npm run test:e2e
        working-directory: frontend
        env:
          CI: true
          NEXT_PUBLIC_API_URL: http://localhost:3001

      - name: 📊 Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

      - name: 📸 Upload Playwright screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots
          path: frontend/test-results/
          retention-days: 3

  # ─────────────────────────────────────────────────────────────
  # JOB 4: Lint Check
  # ─────────────────────────────────────────────────────────────
  lint:
    name: 🔍 Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 📦 Install backend deps & lint
        run: |
          npm ci && npm run lint --workspace=backend
        continue-on-error: true

      - name: 📦 Install frontend deps & lint
        run: |
          npm ci && npm run lint --workspace=frontend
        continue-on-error: true
